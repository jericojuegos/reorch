[project]
name = "reorch-worker"
version = "0.1.0"
description = "Audio processing worker for REORCH platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "aioboto3>=13.0.0",
    "pydub>=0.25.0",
    "pedalboard>=0.9.0",
    "pyloudnorm>=0.1.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pyrubberband>=0.4.0",
    "audioop-lts>=0.2.1; python_version>='3.13'",
]

[tool.setuptools]
py-modules = ["main", "config", "queue_client", "database", "s3_client"]
packages = ["pipeline"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
